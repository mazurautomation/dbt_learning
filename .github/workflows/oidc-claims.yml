name: Inspect GitHub OIDC claims

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  inspect-oidc:
    name: Inspect OIDC claims
    runs-on: ubuntu-latest
    environment: prod

    env:
      OIDC_AUDIENCE: https://github.com/${{ github.repository_owner }}

    steps:
      - name: Request GitHub OIDC token and show claims
        shell: bash
        run: |
          set -euo pipefail

          RESPONSE=$(
            curl -fsSL \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}"
          )

          OIDC_TOKEN=$(echo "$RESPONSE" | jq -r '.value')

          if [ -z "$OIDC_TOKEN" ] || [ "$OIDC_TOKEN" = "null" ]; then
            echo "GitHub did not return an OIDC token."
            exit 1
          fi

          export OIDC_TOKEN

          python - <<'PY'
          import os
          import json
          import base64

          token = os.environ["OIDC_TOKEN"]
          payload = token.split(".")[1]

          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload).decode("utf-8")
          )

          keys = [
              "iss",
              "aud",
              "sub",
              "repository",
              "repository_id",
              "repository_owner",
              "repository_owner_id",
              "environment",
              "ref",
              "job_workflow_ref",
          ]

          print("GitHub OIDC claims:")
          print()

          for key in keys:
              if key in claims:
                  print(f"{key}: {claims[key]}")
          PY