name: PR CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: dbt-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Validate and test DEV
    runs-on: ubuntu-latest
    environment: dev

    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle
        run: databricks bundle validate -t dev

      - name: Plan DEV deployment
        run: databricks bundle plan -t dev

      - name: Deploy DEV bundle
        run: databricks bundle deploy -t dev

      - name: Run dbt DEV job
        run: databricks bundle run -t dev pharmacy_analytics_dbt_job