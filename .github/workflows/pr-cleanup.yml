name: PR CI Cleanup

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read

jobs:
  cleanup:
    name: Cleanup dbt CI schemas
    runs-on: ubuntu-latest
    environment: dev

    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_HTTP_PATH: ${{ vars.DATABRICKS_HTTP_PATH }}
      DATABRICKS_CATALOG: ${{ vars.DATABRICKS_CATALOG }}

      PR_NUMBER: ${{ github.event.pull_request.number }}
      CI_SCHEMA: dbt_ci_pr_${{ github.event.pull_request.number }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install dbt-databricks==1.12.5

      - name: Install dbt packages
        run: dbt deps

      - name: Create dbt cleanup profile
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ~/.dbt

          DBT_HOST="${DATABRICKS_HOST#https://}"

          cat > ~/.dbt/profiles.yml <<EOF
          pharmacy_analytics:
            target: ci

            outputs:
              ci:
                type: databricks
                method: http
                catalog: ${DATABRICKS_CATALOG}
                schema: ${CI_SCHEMA}
                host: ${DBT_HOST}
                http_path: ${DATABRICKS_HTTP_PATH}
                token: ${DATABRICKS_TOKEN}
                threads: 4
          EOF

      - name: Check dbt connection
        run: dbt debug --target ci

      - name: Drop PR schemas
        run: |
          dbt run-operation drop_ci_schemas \
            --target ci \
            --args "{pr_number: ${PR_NUMBER}}"