resources:
  jobs:
    pharmacy_analytics_dbt_job:
      name: pharmacy_analytics_dbt_prod

      max_concurrent_runs: 1

      tasks:
        - task_key: dbt_build

          environment_key: dbt_environment

          dbt_task:
            source: WORKSPACE
            project_directory: ${workspace.file_path}

            commands:
              - "dbt build --vars '{environment: ${var.dbt_environment}}'"

            warehouse_id: ${var.warehouse_id}
            catalog: ${var.catalog}
            schema: ${var.dbt_base_schema}

          max_retries: 1
          min_retry_interval_millis: 30000

      environments:
        - environment_key: dbt_environment
          spec:
            environment_version: "5"
            dependencies:
              - "dbt-databricks==1.12.5"