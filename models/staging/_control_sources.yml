version: 2

sources:
  - name: pipeline_control
    database: "{{ target.catalog }}"
    schema: ops

    tables:
      - name: cdc_batch_control
        description: >
          Stores the last successfully processed CDC ingestion batch
          per environment and pipeline.

        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns:
                  - environment
                  - pipeline_name

        columns:
          - name: environment
            description: "Execution environment owning the pipeline watermark."
            data_tests:
              - not_null

          - name: pipeline_name
            description: "Logical pipeline identifier."
            data_tests:
              - not_null

          - name: last_successful_batch_id
            description: "Highest ingestion batch successfully processed."
            data_tests:
              - not_null