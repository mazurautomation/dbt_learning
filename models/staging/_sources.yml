version: 2

sources:
  - name: pharmacy_bronze
    description: "Bronze layer populated by ingestion. dbt treats it as an external source."
    database: "{{ target.catalog }}"
    schema: bronze

    tables:
      - name: customers
        description: "Raw customer records as received from the source system."
        columns:
          - name: customer_id
            data_tests:
              - not_null

      - name: products
        description: "Raw product catalogue."
        columns:
          - name: product_id
            data_tests:
              - not_null

      - name: orders_cdc
        description: "Append-only CDC events for orders."
        config:
          freshness:
            warn_after: {count: 24, period: hour}
            error_after: {count: 72, period: hour}
          loaded_at_field: _loaded_at

        data_tests:
          - cdc_sequence_consistent:
              arguments:
                key_column: order_id
                sequence_column: _cdc_sequence
                payload_columns:
                  - customer_id
                  - order_status
                  - ordered_at
                  - updated_at
                  - _cdc_operation

        columns:
          - name: order_id
            data_tests:
              - not_null

          - name: _cdc_operation
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['I', 'U', 'D']

          - name: _cdc_sequence
            data_tests:
              - not_null

          - name: _ingest_batch_id
            data_tests:
              - not_null

      - name: order_items_cdc
        description: "Append-only CDC events for order items."

        data_tests:
          - cdc_sequence_consistent:
              arguments:
                key_column: order_item_id
                sequence_column: _cdc_sequence
                payload_columns:
                  - order_id
                  - product_id
                  - quantity
                  - unit_price
                  - updated_at
                  - _cdc_operation

        columns:
          - name: order_item_id
            data_tests:
              - not_null

          - name: _cdc_operation
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['I', 'U', 'D']

          - name: _cdc_sequence
            data_tests:
              - not_null

          - name: _ingest_batch_id
            data_tests:
              - not_null

      - name: payments_cdc
        description: "Append-only CDC events for payments."

        data_tests:
          - cdc_sequence_consistent:
              arguments:
                key_column: payment_id
                sequence_column: _cdc_sequence
                payload_columns:
                  - order_id
                  - payment_method
                  - payment_status
                  - amount
                  - paid_at
                  - updated_at
                  - _cdc_operation

        columns:
          - name: payment_id
            data_tests:
              - not_null

          - name: _cdc_operation
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['I', 'U', 'D']

          - name: _cdc_sequence
            data_tests:
              - not_null

          - name: _ingest_batch_id
            data_tests:
              - not_null