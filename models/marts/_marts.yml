version: 2

models:
  - name: dim_customers
    description: "Current customer dimension."
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique

  - name: dim_products
    description: "Current product dimension."
    columns:
      - name: product_id
        data_tests:
          - not_null
          - unique

  - name: fct_orders
    description: "Gold fact table containing one row per order."

    config:
      contract:
        enforced: true

    columns:
      - name: order_id
        data_type: bigint
        data_tests:
          - not_null
          - unique

      - name: customer_id
        data_type: bigint
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

      - name: order_status
        data_type: string
        data_tests:
          - accepted_values:
              arguments:
                values: ['pending', 'paid', 'shipped', 'cancelled']

      - name: ordered_at
        data_type: timestamp

      - name: item_quantity
        data_type: bigint

      - name: order_amount
        data_type: decimal(12,2)
        data_tests:
          - not_null

      - name: paid_amount
        data_type: decimal(12,2)

      - name: currency_code
        data_type: string
        description: "Currency used for order and payment amounts."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['PLN']

      - name: is_deleted
        data_type: boolean

      - name: record_updated_at
        data_type: timestamp
        data_tests:
          - not_null

      - name: _ingest_batch_id
        data_type: bigint

  - name: fct_daily_sales
    description: "Daily sales aggregate based on paid or shipped orders."
    columns:
      - name: sales_date
        data_tests:
          - not_null
          - unique
