version: 2

unit_tests:

  # --------------------------------------------------------------------------
  # int_orders_enriched
  # --------------------------------------------------------------------------

  - name: test_int_orders_enriched_complete_order
    description: >
      Complete active order should contain item and payment amounts and use
      the latest timestamp from all inputs as record_updated_at.

    model: int_orders_enriched

    given:

      - input: ref('stg_orders')
        format: sql
        rows: |
          select
              cast(1001 as bigint) as order_id,
              cast(1 as bigint) as customer_id,
              'paid' as order_status,
              cast('2026-10-01 10:00:00' as timestamp) as ordered_at,
              cast('2026-10-01 10:05:00' as timestamp) as updated_at,
              cast('2026-10-01 10:04:00' as timestamp) as _loaded_at,
              cast(1 as bigint) as _ingest_batch_id,
              false as is_deleted

      - input: ref('int_order_items_aggregated')
        format: sql
        rows: |
          select
              cast(1001 as bigint) as order_id,
              cast(3 as bigint) as item_quantity,
              cast(45.50 as decimal(12, 2)) as order_amount,
              cast('2026-10-01 10:06:00' as timestamp) as items_updated_at,
              cast(2 as bigint) as items_batch_id

      - input: ref('int_payments_aggregated')
        format: sql
        rows: |
          select
              cast(1001 as bigint) as order_id,
              cast(45.50 as decimal(12, 2)) as paid_amount,
              cast('2026-10-01 10:07:00' as timestamp) as payments_updated_at,
              cast(3 as bigint) as payments_batch_id

    expect:
      format: dict
      rows:
        - order_id: 1001
          customer_id: 1
          order_status: paid
          item_quantity: 3
          order_amount: 45.50
          paid_amount: 45.50
          is_deleted: false
          record_updated_at: '2026-10-01 10:07:00'
          _ingest_batch_id: 3


  - name: test_int_orders_enriched_without_payment
    description: >
      Active order without a payment should remain in the model and paid_amount
      should default to zero.

    model: int_orders_enriched

    given:

      - input: ref('stg_orders')
        format: sql
        rows: |
          select
              cast(1002 as bigint) as order_id,
              cast(2 as bigint) as customer_id,
              'pending' as order_status,
              cast('2026-10-01 11:00:00' as timestamp) as ordered_at,
              cast('2026-10-01 11:05:00' as timestamp) as updated_at,
              cast('2026-10-01 11:04:00' as timestamp) as _loaded_at,
              cast(1 as bigint) as _ingest_batch_id,
              false as is_deleted

      - input: ref('int_order_items_aggregated')
        format: sql
        rows: |
          select
              cast(1002 as bigint) as order_id,
              cast(2 as bigint) as item_quantity,
              cast(20.00 as decimal(12, 2)) as order_amount,
              cast('2026-10-01 11:06:00' as timestamp) as items_updated_at,
              cast(2 as bigint) as items_batch_id

      - input: ref('int_payments_aggregated')
        format: sql
        rows: |
          select
              cast(null as bigint) as order_id,
              cast(null as decimal(12, 2)) as paid_amount,
              cast(null as timestamp) as payments_updated_at,
              cast(null as bigint) as payments_batch_id
          where false

    expect:
      format: dict
      rows:
        - order_id: 1002
          order_status: pending
          item_quantity: 2
          order_amount: 20.00
          paid_amount: 0.00
          is_deleted: false
          record_updated_at: '2026-10-01 11:06:00'
          _ingest_batch_id: 2


  - name: test_int_orders_enriched_without_items_or_payment
    description: >
      Active order without items or payments should remain in the model with
      zero amounts.

    model: int_orders_enriched

    given:

      - input: ref('stg_orders')
        format: sql
        rows: |
          select
              cast(1003 as bigint) as order_id,
              cast(3 as bigint) as customer_id,
              'cancelled' as order_status,
              cast('2026-10-01 12:00:00' as timestamp) as ordered_at,
              cast('2026-10-01 12:05:00' as timestamp) as updated_at,
              cast('2026-10-01 12:10:00' as timestamp) as _loaded_at,
              cast(3 as bigint) as _ingest_batch_id,
              false as is_deleted

      - input: ref('int_order_items_aggregated')
        format: sql
        rows: |
          select
              cast(null as bigint) as order_id,
              cast(null as bigint) as item_quantity,
              cast(null as decimal(12, 2)) as order_amount,
              cast(null as timestamp) as items_updated_at,
              cast(null as bigint) as items_batch_id
          where false

      - input: ref('int_payments_aggregated')
        format: sql
        rows: |
          select
              cast(null as bigint) as order_id,
              cast(null as decimal(12, 2)) as paid_amount,
              cast(null as timestamp) as payments_updated_at,
              cast(null as bigint) as payments_batch_id
          where false

    expect:
      format: dict
      rows:
        - order_id: 1003
          order_status: cancelled
          item_quantity: 0
          order_amount: 0.00
          paid_amount: 0.00
          is_deleted: false
          record_updated_at: '2026-10-01 12:10:00'
          _ingest_batch_id: 3


  - name: test_int_orders_enriched_propagates_delete_tombstone
    description: >
      Deleted Silver order must remain visible to downstream processing as a
      tombstone so Gold can physically delete it.

    model: int_orders_enriched

    given:

      - input: ref('stg_orders')
        format: sql
        rows: |
          select
              cast(1004 as bigint) as order_id,
              cast(4 as bigint) as customer_id,
              'cancelled' as order_status,
              cast('2026-10-01 12:00:00' as timestamp) as ordered_at,
              cast('2026-10-01 12:05:00' as timestamp) as updated_at,
              cast('2026-10-01 13:30:00' as timestamp) as _loaded_at,
              cast(4 as bigint) as _ingest_batch_id,
              true as is_deleted

      - input: ref('int_order_items_aggregated')
        format: sql
        rows: |
          select
              cast(null as bigint) as order_id,
              cast(null as bigint) as item_quantity,
              cast(null as decimal(12, 2)) as order_amount,
              cast(null as timestamp) as items_updated_at,
              cast(null as bigint) as items_batch_id
          where false

      - input: ref('int_payments_aggregated')
        format: sql
        rows: |
          select
              cast(null as bigint) as order_id,
              cast(null as decimal(12, 2)) as paid_amount,
              cast(null as timestamp) as payments_updated_at,
              cast(null as bigint) as payments_batch_id
          where false

    expect:
      format: dict
      rows:
        - order_id: 1004
          item_quantity: 0
          order_amount: 0.00
          paid_amount: 0.00
          is_deleted: true
          record_updated_at: '2026-10-01 13:30:00'
          _ingest_batch_id: 4


  # --------------------------------------------------------------------------
  # int_order_items_aggregated
  # --------------------------------------------------------------------------

  - name: test_order_items_aggregation_ignores_deleted_items
    description: >
      Deleted order items must not contribute to business amounts but their
      ingestion metadata must still advance downstream processing state.

    model: int_order_items_aggregated

    given:

      - input: ref('stg_order_items')
        format: sql
        rows: |
          select
              cast(4001 as bigint) as order_item_id,
              cast(1001 as bigint) as order_id,
              cast(2 as int) as quantity,
              cast(10.00 as decimal(12, 2)) as unit_price,
              false as is_deleted,
              cast('2026-10-01 10:00:00' as timestamp) as _loaded_at,
              cast(1 as bigint) as _ingest_batch_id

          union all

          select
              cast(4002 as bigint),
              cast(1001 as bigint),
              cast(1 as int),
              cast(5.00 as decimal(12, 2)),
              true,
              cast('2026-10-01 10:10:00' as timestamp),
              cast(2 as bigint)

    expect:
      format: dict
      rows:
        - order_id: 1001
          item_quantity: 2
          order_amount: 20.00
          items_updated_at: '2026-10-01 10:10:00'
          items_batch_id: 2


  # --------------------------------------------------------------------------
  # int_payments_aggregated
  # --------------------------------------------------------------------------

  - name: test_payment_aggregation_ignores_deleted_payments
    description: >
      Deleted payments must not contribute to paid_amount but their ingestion
      metadata must still advance downstream processing state.

    model: int_payments_aggregated

    given:

      - input: ref('stg_payments')
        format: sql
        rows: |
          select
              cast(5001 as bigint) as payment_id,
              cast(1001 as bigint) as order_id,
              'paid' as payment_status,
              cast(20.00 as decimal(12, 2)) as amount,
              false as is_deleted,
              cast('2026-10-01 10:00:00' as timestamp) as _loaded_at,
              cast(1 as bigint) as _ingest_batch_id

          union all

          select
              cast(5002 as bigint),
              cast(1001 as bigint),
              'paid',
              cast(5.00 as decimal(12, 2)),
              true,
              cast('2026-10-01 10:15:00' as timestamp),
              cast(2 as bigint)

    expect:
      format: dict
      rows:
        - order_id: 1001
          paid_amount: 20.00
          payments_updated_at: '2026-10-01 10:15:00'
          payments_batch_id: 2
